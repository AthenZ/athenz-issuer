apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "athenz-issuer.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "athenz-issuer.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "athenz-issuer.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        {{- include "athenz-issuer.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: {{ .Chart.Name }}
        # A trick to roll deployments automatically whenever there's a helm chart upgrade.
        # Ref: https://helm.sh/docs/howto/charts_tips_and_tricks/#automatically-roll-deployments
        rollme: {{ randAlphaNum 5 | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ template "athenz-issuer.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ template "athenz-issuer.name" . }}
          image: "{{ template "image" (tuple .Values.image $.Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $mcr := .Values.maxConcurrentReconciles }}
          {{- $qps := .Values.kubeApiQps }}
          {{- $burst := .Values.kubeApiBurst }}
          {{- $mrd := .Values.maxRetryDuration }}
          {{- if and (not (kindIs "invalid" $mcr)) (or (lt (float64 $mcr) 1.0) (ne (float64 $mcr) (float64 (int $mcr)))) }}
          {{- fail "maxConcurrentReconciles must be an integer >= 1" }}
          {{- end }}
          {{- if and (not (kindIs "invalid" $burst)) (ne (float64 $burst) (float64 (int $burst))) }}
          {{- fail "kubeApiBurst must be an integer" }}
          {{- end }}
          {{- if not (and (kindIs "invalid" $mcr) (kindIs "invalid" $qps) (kindIs "invalid" $burst) (kindIs "invalid" $mrd)) }}
          args:
            {{- if not (kindIs "invalid" $mcr) }}
            - --max-concurrent-reconciles={{ $mcr | int }}
            {{- end }}
            {{- if not (kindIs "invalid" $qps) }}
            - --kube-api-qps={{ $qps }}
            {{- end }}
            {{- if not (kindIs "invalid" $burst) }}
            - --kube-api-burst={{ $burst | int }}
            {{- end }}
            {{- if not (kindIs "invalid" $mrd) }}
            - {{ printf "--max-retry-duration=%s" $mrd | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with  .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
